name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch only cares about its newest run. Cancel the ones it superseded
# instead of paying for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Nothing here needs write access.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SETTINGS_MODULE: seguros.settings

# lint, test and security are independent and run in parallel. A trailing
# space must never be able to stop the test suite from running.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black==24.1.1 isort==5.13.2 flake8==7.0.0

      - name: Byte-compile every module
        run: |
          # Catches syntax errors the linter is configured to skip.
          # app/management/commands/poblar_datos_prueba.py is excluded here and
          # in .flake8 because its indentation is corrupted and it has never
          # compiled. Fix or delete it, then drop this exclusion.
          find app seguros -name '*.py' \
            ! -path '*/migrations/*' \
            ! -name 'poblar_datos_prueba.py' \
            -print0 | xargs -0 python -m py_compile

      - name: black
        run: black --check --diff .

      - name: isort
        run: isort --check-only --diff .

      - name: flake8
        run: flake8 . --count --statistics

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_seguros
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_seguros
      CELERY_BROKER_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret-000000000000000000000000000000000000
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.0.0 pytest-django==4.7.0 pytest-cov==4.1.0

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --no-input

      - name: Migrate
        run: python manage.py migrate --no-input

      - name: Deployment checklist
        run: python manage.py check --deploy

      - name: Collect static files
        run: python manage.py collectstatic --no-input

      - name: Run tests
        run: pytest --cov=app --cov=seguros --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install bandit==1.7.6 pip-audit

      - name: bandit
        run: bandit -r app seguros -x '*/migrations/*,*/tests.py' -ll

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt
